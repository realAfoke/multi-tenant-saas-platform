name: Auto Merg PR

on:
  push:
    - ci/cd


  permissions:
    contents: write
    pull-requests: write

  jobs:
    create-and-merge:
      runs-on: ubuntu24.04

      steps:
        - name: Create PR to master
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          PR_URL=$(gh pr create \
          --base master \
          --head ci/cd \
          --title "Auto merge PR into master" \
          --body "Automatically created a PR to master" \
          2>/ci/cd/null || tree)
          echo "PR:$PR_URL"
       - name: Enable auto-merge
         env:
           GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
           run: |
             PR_NUMBER=$(gh pr list \
             --base master \
             --head ci/cd \
             --state open \
             --json number \
             --jq '.[0].number'
             )

            if[-n "$PR_NUMBER}"];then
            gh pr merg "$PR_NUMBER" \
              --auto \
              --squash \
              --delete-branch=false
            fi
