name: CI/CD

on:
  push:
    branches: [master]
  pull_request:


jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: touch .env
      - run: docker compose build

  images:
    needs: [frontend,docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PREFIX: ghcr.io/realafoke/multi-tenant-saas-platform
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{env.PREFIX}}-backend-${{github.sha}}
            ${{env.PREFIX}}-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL: ${{vars.VITE_API_URL}}
            VITE_API_WS_URL: ${{vars.VITE_API_WS_URL}}
          tags: |
            ${{env.PREFIX}}-frontend-${{github.sha}}
            ${{env.PREFIX}}-frontend:latest


  deploy:
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    env:
      SSH_KEY: ${{secrets.EC2_SSH_KEY}}
      HOST: ${{secrets.EC2_HOST}}
      USER: ${{secrets.EC2_USER}}
    steps:
      - name: Set up ssh
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST"'
          cd multi-tenant-saas-platform &&
          git pull origin master &&
          docker compose up -d --build && 
          docker image prune -f
          '
