services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD","pg_isready","-U","${DB_USER}","-d","${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - database_storage:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build: ./backend
    image: backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_WS_URL: ${VITE_API_WS_URL}
    depends_on:
      backend:
        condition: service_started

    ports: 
    - "80:80"
    - "443:443"
    restart: unless-stopped


  redis:
    image: redis:7-alpine

    restart: unless-stopped

volumes:
  database_storage:
