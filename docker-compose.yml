services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD","pg_isready","-U","${DB_USER}","-d","${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - database_storage:/var/lib/postgresql

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_WS_URL: ${VITE_API_WS_URL}
    depends_on:
      backend:
        condition: service_started

    ports: 
    - "80:80"
    - "443:443"


  redis:
    image: redis

volumes:
  database_storage:
